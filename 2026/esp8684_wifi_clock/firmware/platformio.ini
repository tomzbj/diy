; ESP32-C2 / ESP8684: 2MB flash, DIO, 40 MHz XTAL.
;
; Stock Arduino-ESP32 C2 libs + bootloader ELFs are all 26 MHz (DevKitM-1).
; custom_sdkconfig under framework=arduino rebuilds the app only and still
; flashes that 26 MHz bootloader — 40 MHz app then asserts in esp_clk_init.
; framework=arduino,esp-idf builds bootloader and app from the same sdkconfig.

[platformio]
build_cache_dir = .cache 

[env:esp32-c2-devkitm-1]
platform = espressif32
board = esp32-c2-devkitm-1
framework = arduino, espidf
monitor_speed = 115200
extra_scripts = post:fix_eclipse_upload.py
board_build.flash_mode = dio
board_build.esp-idf.preserve_source_file_extension = yes
board_upload.flash_size = 2MB
board_upload.maximum_size = 2097152
board_build.partitions = partitions.csv
build_flags =
  -D IDF_CCACHE_ENABLE=1 
  -I include
  -I lib/ztask
  -I lib/zcli
  -I lib/zi2c
  -I lib/drv
  -I D:/work/3rdparty/u8g2/csrc
  -Wno-volatile